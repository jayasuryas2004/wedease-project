<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wedease</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="images/wedeaselogo.png" alt="Wedease Logo">
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="auth-buttons">
                <a href="register.html" class="login-btn">Register</a>
            </div>
        </nav>
    </header>
    <div class="login-container">
        <div class="login-card">
            <img src="images/wedeaselogo.png" alt="Wedease Logo" class="auth-logo">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
            <div class="auth-links">
                <a href="register.html">Don't have account? Register</a>
                <a href="contact.html">Forgot Password?</a>
            </div>
            <div class="social-login">
                <button class="social-btn google-btn"><i class="fab fa-google"></i> Google</button>
                <button class="social-btn facebook-btn"><i class="fab fa-facebook"></i> Facebook</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
